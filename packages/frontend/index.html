<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Nexus — защищённый мессенджер: чаты, файлы, Nexus Motes." />
    <link rel="icon" type="image/png" href="/neon.png" />
    <link rel="apple-touch-icon" href="/neon.png" />
    <title>Nexus</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      :root {
  --color-background: #0a0a0a;
  --color-background-secondary: #131315;
  --color-surface: #1d1d20;
  --color-accent: #dc2626;
  --color-accent-hover: #ef4444;
  --color-text: #f5f5f7;
  --color-text-muted: #8e8e93;
  --color-border: #2a2a2d;
  --color-error: #ff453a;
  --color-success: #30d158;
}
      .chat-wallpaper {
  background-color: var(--color-background);
  background-image:
    radial-gradient(1100px 550px at 85% -10%, color-mix(in srgb, var(--color-accent) 9%, transparent), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, color-mix(in srgb, var(--color-accent) 6%, transparent), transparent 60%),
    radial-gradient(color-mix(in srgb, var(--color-text) 4%, transparent) 1px, transparent 1.4px);
  background-size: auto, auto, 22px 22px;
}
      .nexus-splash { display: flex; align-items: center; justify-content: center; height: 100dvh; }
      .nexus-logo {
        width: 64px; height: 64px; border-radius: 30%;
        display: flex; align-items: center; justify-content: center;
        font: 900 32px/1 'Inter', -apple-system, sans-serif; color: #fff;
        background-image: linear-gradient(135deg, #ff6a5e, #dc2626 55%, #7f101d);
        box-shadow: 0 6px 20px rgba(220, 38, 38, .4);
      }
      .nexus-pulse { animation: nexus-pulse 2s cubic-bezier(.4, 0, .6, 1) infinite; }
      @keyframes nexus-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
  </head>
  <body>
    <!-- исчезнет, когда React смонтирует приложение — визуально тот же Splash -->
    <div id="root">
      <div class="nexus-splash chat-wallpaper">
        <div class="nexus-logo nexus-pulse">N</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
      <script>
      window.__nexusBooted = false;
      window.addEventListener('error', function (e) {
        var d = document.createElement('pre');
        d.style.cssText = 'color:#f87171;padding:16px;font-size:12px;white-space:pre-wrap;position:fixed;inset:0;background:#000;z-index:99999;overflow:auto';
        d.textContent = 'PAGE ERROR: ' + (e.message || 'unknown') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || '');
        document.body.appendChild(d);
      });
      setTimeout(function () {
        if (!window.__nexusBooted) {
          var d = document.createElement('pre');
          d.style.cssText = 'color:#fbbf24;padding:12px;font-size:12px;white-space:pre-wrap;position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.85);z-index:99999';
          d.textContent = 'React не смонтировался за 10 сек: модули не загрузились (сеть/туннель) или ошибка импорта.';
          document.body.appendChild(d);
        }
      }, 10000);
    </script>
  </body>
</html>
