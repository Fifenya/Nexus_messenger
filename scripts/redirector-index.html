<!doctype html>
<html><head><meta charset="utf-8"><title>Nexus</title></head>
<body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#eee;font-family:system-ui,sans-serif">
<div style="text-align:center">
  <div style="font-size:42px">🐈‍</div>
  <div id="s" style="margin-top:8px">Ищем сервер…</div>
</div>
<script>
fetch('url.txt?'+Date.now(),{cache:'no-store'})
  .then(r=>r.text())
  .then(t=>{t=t.trim(); if(t.startsWith('https://')) location.replace(t);
            else document.getElementById('s').textContent='Сервер сейчас офлайн';})
  .catch(()=>document.getElementById('s').textContent='Нет сети');
</script>
</body></html>
